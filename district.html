<!doctype html>
<!--
  The confirmation page for district-review links (supabase/functions/district-review).
  Host it next to review.html (for example https://fittd.net/district.html), set FUNCTION_URL below,
  then set the function secret DISTRICT_REVIEW_PAGE to its address and make sure ALLOWED_ORIGINS
  includes its origin. The emailed links become <page>#t=<token>.

  Opening the page changes nothing: it asks the function what the link would do (preview) and only
  acts when Confirm is pressed. Everything from the server is shown with textContent.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>fittd: school email</title>
<style>
  body { font: 17px/1.45 -apple-system, system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1.25rem; }
  button { font: inherit; padding: .6rem 1.2rem; border-radius: .6rem; border: 1px solid #111; background: #111; color: #fff; }
  button[disabled] { opacity: .5; }
</style>
</head>
<body>
<h1>School email</h1>
<p id="message">Checking the link…</p>
<p><button id="confirm" hidden>Confirm</button></p>
<script>
  // The project's district-review function: https://<project-ref>.supabase.co/functions/v1/district-review
  const FUNCTION_URL = "https://ccuerdwanhbywktqrdry.supabase.co/functions/v1/district-review";

  const message = document.getElementById("message");
  const button = document.getElementById("confirm");
  const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";

  async function send(preview) {
    const res = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, preview }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((body.error && body.error.message) || "That didn't work. Try again.");
    return body;
  }

  if (!token) {
    message.textContent = "Open the link from the email.";
  } else {
    send(true).then((body) => {
      message.textContent = body.message;
      button.textContent = body.action === "approve" ? "Approve" : "Reject";
      button.hidden = false;
    }).catch((err) => { message.textContent = err.message; });
  }

  button.addEventListener("click", () => {
    button.disabled = true;
    send(false).then((body) => {
      message.textContent = body.message;
      button.hidden = true;
    }).catch((err) => {
      message.textContent = err.message;
      button.disabled = false;
    });
  });
</script>
</body>
</html>
